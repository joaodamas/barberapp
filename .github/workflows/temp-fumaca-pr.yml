name: TEMPORARIO fumaca contra o DEV

# Temporário: prova o fumaca.mjs novo contra o DEV publicado, sem credencial.
# Sai do PR antes do merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  fumaca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - working-directory: scripts/fumaca
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: antes
        working-directory: scripts/fumaca
        env:
          SITE: https://cortehub-dev.web.app
          FASE: antes
          PERFIL: ${{ runner.temp }}/perfil
        run: node fumaca.mjs
      - name: depois (completo)
        working-directory: scripts/fumaca
        env:
          SITE: https://cortehub-dev.web.app
          PERFIL: ${{ runner.temp }}/perfil
        run: node fumaca.mjs
      - name: depois (resumo, exigindo build inexistente — deve falhar)
        id: negativo
        continue-on-error: true
        working-directory: scripts/fumaca
        env:
          SITE: https://cortehub-dev.web.app
          PERFIL: ${{ runner.temp }}/perfil
          DETALHE: resumo
          BUILD_ESPERADO: naoexiste000
        run: node fumaca.mjs
      - name: o negativo precisa ter falhado
        run: test "${{ steps.negativo.outcome }}" = "failure"
