name: Deploy

# Publicação manual, nunca automática.
#
# A regra que este arquivo existe para garantir: **o que vai para produção é
# exatamente o commit que atravessou a esteira inteira**. O job `deploy` depende
# de `qualidade`, que é a MESMA esteira do push — não uma cópia. Esteira
# vermelha, nada publica.
#
# A segunda regra: **o alvo do deploy não depende de nada configurado na máquina
# de ninguém.** Toda linha carrega `--project` explícito, e antes de publicar o
# workflow confere que o `.firebaserc` e a própria credencial pertencem ao
# projeto esperado. Credencial de outro projeto não erra o alvo: ela para.
#
# Auditoria de segurança em `docs/DEPLOY.md`. Três decisões que este arquivo
# carrega e que não são óbvias lendo os passos:
#
# - As Actions são fixadas por SHA, não por tag. Tag é ponteiro móvel, e este é
#   o único workflow do repositório com credencial de produção em mãos.
# - A credencial é escrita o mais tarde possível, depois de todo `npm ci` e da
#   instalação do navegador da fumaça. Um `postinstall` de qualquer pacote
#   transitivo roda com o mesmo usuário; se a chave já estivesse em disco,
#   bastaria um pacote comprometido para lê-la.
#   O que ISTO NÃO cobre: o `next build`. O Hosting framework-aware roda o
#   `next build` de dentro do `firebase deploy` — sempre, sem opção de
#   reaproveitar um build feito antes (conferido no firebase-tools 15.25.1,
#   `lib/frameworks/next/index.js`) — e o processo herda o ambiente, com
#   `GOOGLE_APPLICATION_CREDENTIALS` apontando para a chave. Código de
#   terceiros que roda no build (plugins do Next, PostCSS, Tailwind) roda com a
#   chave em disco. A mitigação é a de sempre: dependências fixadas no lock,
#   `npm ci`, e a conta de deploy com o mínimo de papel (`docs/DEPLOY.md`).
# - A credencial é apagada no fim, aconteça o que acontecer.

on:
  # Chamado pela esteira (`esteira.yml`): DEV automático, produção promovida.
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
      escopo:
        type: string
        default: tudo
      urgente:
        type: boolean
        default: false
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: false
  workflow_dispatch:
    inputs:
      ambiente:
        description: Onde publicar
        type: choice
        default: producao
        options:
          - producao
          - dev
      escopo:
        description: O que publicar
        type: choice
        default: tudo
        options:
          - tudo
          - somente hosting
          - somente regras e índices
          - somente functions
      urgente:
        description: "Correção urgente: publica em produção fora da janela das 20h"
        type: boolean
        default: false

# Nenhum job precisa escrever no repositório.
permissions:
  contents: read

# Dois deploys simultâneos disputariam o mesmo release do Hosting. O segundo
# espera; nenhum é cancelado no meio.
concurrency:
  group: deploy-${{ inputs.ambiente }}
  cancel-in-progress: false

jobs:
  qualidade:
    uses: ./.github/workflows/qualidade.yml

  # Janela de produção (combinado com o dono em 28/09, depois do incidente):
  # produção publica à noite, das 20h às 5h59 de Brasília, quando a barbearia
  # já fechou. Fora dela só com `urgente`. Não há limite de publicações por
  # noite — em 03/10 foram quatro, todas dentro da janela.
  #
  # A conferência roda DUAS vezes. Esta, antes da aprovação do ambiente, existe
  # para ninguém aprovar um deploy que ia ser recusado. Mas a aprovação pode
  # chegar horas depois do disparo — um deploy pedido às 23h e aprovado às 10h
  # publicaria em pleno expediente. Por isso a regra que vale é a do primeiro
  # passo do job `deploy`, conferida DEPOIS do portão.
  janela:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a janela de produção (no disparo)
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          URGENTE: ${{ inputs.urgente }}
        run: |
          set -euo pipefail
          HORA=$(TZ=America/Sao_Paulo date +%H)
          echo "hora em Brasília: ${HORA}h · ambiente: $AMBIENTE · urgente: $URGENTE"
          # A janela é a NOITE inteira, 20h às 5h59. Era só "-lt 20", e depois
          # da meia-noite a hora volta a 00 — a trava recusava a madrugada, que
          # é o horário mais seguro de todos (01/10, 00h14).
          # `10#` porque "08" e "09" com zero à esquerda seriam lidos como octal.
          H=$((10#$HORA))
          if [ "$AMBIENTE" = "producao" ] && [ "$URGENTE" != "true" ] && [ "$H" -ge 6 ] && [ "$H" -lt 20 ]; then
            echo "::error::produção só entre 20h e 6h (agora são ${HORA}h em Brasília). Correção urgente: rode de novo marcando 'urgente'."
            exit 1
          fi

  deploy:
    name: publicar em ${{ inputs.ambiente }}
    needs: [qualidade, janela]
    runs-on: ubuntu-latest
    # O ambiente é onde ficam a credencial e a configuração pública, é onde se
    # liga a aprovação obrigatória e é o que restringe a publicação à `main`
    # (`producao` desde 11/08; `dev` desde 08/10).
    # Sem essa restrição, `workflow_dispatch` dispara de qualquer branch — e a
    # branch traria o próprio workflow alterado junto.
    environment: ${{ inputs.ambiente }}

    # `actions: read` para conferir a execução da esteira do DEV deste mesmo
    # commit antes de publicar em produção. Quem chama este workflow
    # (`esteira.yml`) precisa conceder o mesmo, senão a chamada nem começa.
    permissions:
      contents: read
      actions: read

    env:
      # DEV (28/09): projeto separado, sem dado de cliente real. Os dois valores
      # moram aqui, fixos — a trava abaixo confere que `.firebaserc` e a
      # credencial concordam com o ambiente escolhido.
      PROJETO: ${{ inputs.ambiente == 'dev' && 'crucial-baton-440119-r8' || 'axon-barber' }}
      ALIAS: ${{ inputs.ambiente == 'dev' && 'dev' || 'default' }}
      SITE: ${{ inputs.ambiente == 'dev' && 'https://cortehub-dev.web.app' || 'https://axon-barber.web.app' }}
      SITE_ID: ${{ inputs.ambiente == 'dev' && 'cortehub-dev' || 'axon-barber' }}
      # Onde o cliente de verdade entra: é ali que a fumaça olha. Em produção,
      # axon-barber.web.app não tem barbearia nenhuma — o piloto é o subdomínio.
      SITE_FUMACA: ${{ inputs.ambiente == 'dev' && 'https://cortehub-dev.web.app' || 'https://osiqueira.jpproject.com.br' }}

    steps:
      # ── Depois do portão: as duas travas que dependem da hora ───────────
      # PRIMEIRO passo, antes de qualquer trabalho: a aprovação acabou de
      # acontecer, e é a hora DELA que decide (ver o job `janela`).
      - name: Conferir a janela de produção (depois da aprovação)
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          URGENTE: ${{ inputs.urgente }}
        run: |
          set -euo pipefail
          HORA=$(TZ=America/Sao_Paulo date +%H)
          H=$((10#$HORA))
          echo "hora em Brasília na aprovação: ${HORA}h · ambiente: $AMBIENTE · urgente: $URGENTE"
          if [ "$AMBIENTE" = "producao" ] && [ "$URGENTE" != "true" ] && [ "$H" -ge 6 ] && [ "$H" -lt 20 ]; then
            echo "::error::a aprovação chegou às ${HORA}h, fora da janela de produção (20h às 6h). Nada foi publicado. Dispare de novo à noite, ou marque 'urgente' se não puder esperar."
            exit 1
          fi

      # Produção só recebe o commit que já passou pelo DEV — com fumaça. Em
      # 03/10 (8f85cf5) e 04/10 (705c8de) produção foi disparada no mesmo
      # minuto do merge, com o DEV do mesmo commit ainda rodando: a fumaça do
      # DEV, que existe para pegar o problema ANTES, não teve chance.
      #
      # Ainda rodando: espera até 30 min. Vermelha, cancelada ou inexistente:
      # recusa. Com `urgente`, só avisa — a correção urgente pode não poder
      # esperar o DEV, e quem marca `urgente` assume isso.
      - name: Conferir que o DEV deste commit passou
        if: inputs.ambiente == 'producao'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENTE: ${{ inputs.urgente }}
        run: |
          set -euo pipefail
          situacao() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/esteira.yml/runs?head_sha=$GITHUB_SHA&per_page=30" \
              --jq '.workflow_runs as $r
                | if ($r | map(select(.conclusion == "success")) | length) > 0 then "passou"
                  elif ($r | map(select(.status != "completed")) | length) > 0 then "rodando"
                  elif ($r | length) == 0 then "inexistente"
                  else "falhou:" + (($r | sort_by(.created_at) | last | .conclusion) // "?") end'
          }
          LINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/esteira.yml?query=branch%3Amain"
          S=$(situacao)
          echo "DEV de ${GITHUB_SHA:0:7}: $S"
          if [ "$URGENTE" = "true" ]; then
            [ "$S" = "passou" ] || echo "::warning::urgente: publicando em produção sem o DEV de ${GITHUB_SHA:0:7} concluído com sucesso ($S). $LINK"
            exit 0
          fi
          for _ in $(seq 1 60); do
            [ "$S" = "rodando" ] || break
            echo "  o DEV de ${GITHUB_SHA:0:7} ainda está rodando; esperando…"
            sleep 30
            S=$(situacao)
          done
          case "$S" in
            passou) echo "DEV de ${GITHUB_SHA:0:7} passou, com fumaça." ;;
            rodando) echo "::error::o DEV de ${GITHUB_SHA:0:7} não terminou em 30 minutos. Nada foi publicado. $LINK"; exit 1 ;;
            inexistente) echo "::error::não há execução da esteira do DEV para ${GITHUB_SHA:0:7} — este commit não passou pela main? Nada foi publicado."; exit 1 ;;
            *) echo "::error::o DEV de ${GITHUB_SHA:0:7} não passou (${S#falhou:}). Produção não recebe o que o DEV recusou. $LINK"; exit 1 ;;
          esac

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # A trava de alvo, antes de qualquer trabalho. Três origens independentes
      # precisam concordar: o valor fixo aqui, o `.firebaserc` do commit e o
      # projeto de quem assina a credencial. Uma alteração futura no workflow
      # que aponte para outro lugar morre nesta etapa, não em produção.
      #
      # Lê o segredo da variável de ambiente e não escreve nada em disco: neste
      # ponto ainda não instalamos dependência nenhuma.
      - name: Conferir o alvo do deploy
        env:
          CREDENCIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${CREDENCIAL:-}" ]; then
            echo "::error::secret FIREBASE_SERVICE_ACCOUNT ausente no ambiente '${{ inputs.ambiente }}'"
            exit 1
          fi

          # Lido como JSON explicitamente. `require('./.firebaserc')` parece
          # equivalente e não é: sem extensão, o Node carrega o arquivo com o
          # loader de JavaScript, e `{"projects": {` vira erro de sintaxe. A
          # trava de alvo derrubava o deploy antes de conferir alvo nenhum —
          # e só apareceu no dia em que o job passou da checagem da credencial.
          NO_REPO=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects['$ALIAS']")
          # try/catch para que um JSON malformado não jogue pedaço de
          # credencial no log.
          DA_CREDENCIAL=$(node -e "try{process.stdout.write(String(JSON.parse(process.env.CREDENCIAL).project_id))}catch(e){process.stdout.write('ilegivel')}")

          echo "alvo declarado no workflow : $PROJETO"
          echo "alvo do .firebaserc        : $NO_REPO"
          echo "projeto da credencial      : $DA_CREDENCIAL"

          if [ "$NO_REPO" != "$PROJETO" ]; then
            echo "::error::.firebaserc aponta para '$NO_REPO', e o deploy é de '$PROJETO'."
            exit 1
          fi
          if [ "$DA_CREDENCIAL" != "$PROJETO" ]; then
            echo "::error::a credencial pertence a '$DA_CREDENCIAL', e o deploy é de '$PROJETO'."
            exit 1
          fi

      # ── Tudo que não precisa de credencial vem antes dela ───────────────
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: web

      - run: npm install -g firebase-tools@15.25.1
      - name: Habilitar webframeworks (o Hosting deste projeto é framework-aware)
        run: firebase experiments:enable webframeworks

      # Publicar functions por NOME, nunca com `--only functions` seco.
      #
      # Existe em produção uma função sem código no repositório
      # (`revisarAssinaturas`). Um deploy por escopo aberto entende que ela foi
      # apagada e tenta removê-la. A lista sai dos próprios exports compilados,
      # então uma função nova entra sozinha e nada some por descuido.
      - name: Descobrir as functions do repositório
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente functions'
        working-directory: functions
        run: |
          set -euo pipefail
          npm run build
          LISTA=$(node -e "
            const m = require('./lib/index.js');
            const nomes = Object.entries(m).filter(([, v]) => v && v.__endpoint).map(([k]) => k);
            if (!nomes.length) { console.error('nenhuma function exportada em index.ts'); process.exit(1); }
            process.stdout.write(nomes.map((n) => 'functions:' + n).join(','));
          ")
          echo "ALVOS_FUNCTIONS=$LISTA" >> "$GITHUB_ENV"
          echo "$LISTA" | tr ',' '\n' | sed 's/^/  · /'

      # O navegador da fumaça é instalado AGORA, antes da credencial existir
      # em disco — pela mesma razão dos `npm ci` acima.
      # Travou 35 min instalando o Chromium em 01/10 (runner do GitHub) e
      # segurou o deploy. Com teto, falha cedo e dá para rodar de novo.
      - name: Preparar a fumaça
        timeout-minutes: 10
        working-directory: scripts/fumaca
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # O cenário de 28/09, montado de propósito: um navegador com perfil
      # persistente abre o site QUE ESTÁ NO AR e instala o service worker
      # dela. Depois do deploy, a fumaça reabre com o MESMO perfil — é o
      # celular de quem já usava o app — e exige que a versão nova assuma e
      # responda. Antes da credencial, como todo código de terceiros.
      # Não segura o deploy: se o site no ar já está quebrado, publicar a
      # correção é justamente o que se quer. Só faz a fumaça pular o cenário.
      - name: Abrir o site no ar antes do deploy (service worker da versão atual)
        continue-on-error: true
        timeout-minutes: 5
        working-directory: scripts/fumaca
        env:
          SITE: ${{ env.SITE_FUMACA }}
          FASE: antes
          PERFIL: ${{ runner.temp }}/fumaca-perfil
        run: node fumaca.mjs

      # DEV fora dos buscadores (08/10): cortehub-dev.web.app é público e
      # estava indexável. O `robots.txt` é arquivo estático servido direto
      # pelo Hosting; no DEV ele é trocado ANTES do build por um que recusa
      # tudo. O cabeçalho `X-Robots-Tag: noindex` vem de `next.config.ts`,
      # pela mesma variável que só existe no DEV.
      - name: DEV fora dos buscadores (robots.txt)
        if: inputs.ambiente == 'dev' && (inputs.escopo == 'tudo' || inputs.escopo == 'somente hosting')
        run: |
          printf 'User-agent: *\nDisallow: /\n' > web/public/robots.txt
          cat web/public/robots.txt

      # ── A partir daqui a credencial existe em disco ─────────────────────
      # Fora do workspace, de propósito: nada que empacote o diretório do
      # projeto a leva junto. Permissão 600 e vida curta.
      # O gcloud é ativado aqui, uma vez, para os passos que falam direto com
      # as APIs (versão do Hosting, revisões das functions, regras do Storage).
      - name: Autenticar como a conta de serviço de deploy
        id: autenticar
        env:
          CREDENCIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          ARQUIVO="$RUNNER_TEMP/conta-de-servico.json"
          (umask 077 && printf '%s' "$CREDENCIAL" > "$ARQUIVO")
          chmod 600 "$ARQUIVO"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ARQUIVO" >> "$GITHUB_ENV"
          gcloud auth activate-service-account --key-file="$ARQUIVO" --quiet

      - name: Apontar functions em produção sem código no repositório
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente functions'
        continue-on-error: true
        run: |
          set -uo pipefail
          firebase functions:list --project "$PROJETO" --json > "$RUNNER_TEMP/producao.json" 2>/dev/null || exit 0
          node -e "
            const publicadas = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/producao.json','utf8')).result || [];
            const daqui = new Set(process.env.ALVOS_FUNCTIONS.split(',').map((a) => a.split(':')[1]));
            // ssr* é criada pelo próprio Hosting framework-aware, não pelo repo.
            const orfas = publicadas.map((f) => f.id).filter((id) => !daqui.has(id) && !id.startsWith('ssr'));
            for (const o of orfas) console.log('::warning::function \'' + o + '\' roda em produção e não tem código no repositório — este deploy não a toca');
          "

      # ── Índices e regras ────────────────────────────────────────────────
      # Antes do código: índice novo leva minutos para ficar pronto e regra
      # nova precisa existir antes da tela que depende dela.
      - name: Índices do Firestore
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente regras e índices'
        run: firebase deploy --only firestore:indexes --project "$PROJETO" --non-interactive

      - name: Regras do Firestore
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente regras e índices'
        run: firebase deploy --only firestore:rules --project "$PROJETO" --non-interactive

      # As regras do STORAGE voltaram à esteira (08/10) — com rede.
      #
      # Ficaram de fora desde agosto: a publicação morria com "Firebase Storage
      # has not been set up on project axon-barber", que é como o firebase-tools
      # traduz um 404 do endpoint `v1alpha/projects/{p}/defaultBucket` — 200
      # para o owner, 404 para a conta da esteira, mesmo com
      # `firebasestorage.defaultBucket.get`, `buckets.get`/`list` e o
      # `roles/firebasestorage.viewer` inteiro (ver `docs/DEPLOY.md`). Desde o
      # #127 existe tela que envia arquivo ("Sua marca"), e a ausência deixou
      # de ser inofensiva: regra mudada no repositório e não publicada é
      # exatamente o buraco que o comentário antigo previa.
      #
      # Por isso são dois passos. O primeiro TENTA publicar e não derruba o
      # deploy se a conta não tiver a permissão (`continue-on-error`). O
      # segundo é quem decide: baixa as regras que estão VALENDO no bucket (API
      # do Firebase Rules, que a conta lê com `roles/firebaserules.admin`) e
      # compara com `storage.rules`. Divergiu: vermelho no DEV, aviso em
      # produção — lá, regra de Storage quem publica ainda é o dono.
      - name: Regras do Storage
        id: storage
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente regras e índices'
        continue-on-error: true
        run: firebase deploy --only storage --project "$PROJETO" --non-interactive

      - name: Conferir as regras do Storage publicadas
        id: storage_conferido
        if: always() && steps.storage.outcome != 'skipped' && steps.autenticar.outcome == 'success'
        env:
          BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          AMBIENTE: ${{ inputs.ambiente }}
          PUBLICOU: ${{ steps.storage.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET ausente no ambiente '$AMBIENTE' — não dá para saber qual bucket conferir"
            exit 1
          fi
          TOKEN=$(gcloud auth print-access-token)
          API="https://firebaserules.googleapis.com/v1"
          RULESET=$(curl -sf -H "Authorization: Bearer $TOKEN" "$API/projects/$PROJETO/releases/firebase.storage/$BUCKET" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).rulesetName||''))")
          if [ -z "$RULESET" ]; then
            echo "::error::o bucket $BUCKET não tem regras publicadas (release firebase.storage ausente)"
            exit 1
          fi
          curl -sf -H "Authorization: Bearer $TOKEN" "$API/$RULESET" > "$RUNNER_TEMP/storage-no-ar.json"
          # Compara o texto, ignorando só espaço no fim do arquivo.
          if node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/storage-no-ar.json', 'utf8'));
            const noAr = ((r.source && r.source.files) || []).map((f) => f.content).join('\n').trimEnd();
            const aqui = fs.readFileSync('storage.rules', 'utf8').trimEnd();
            process.exit(noAr === aqui ? 0 : 1);
          "; then
            echo "regras do Storage no ar ($BUCKET) iguais a storage.rules · publicação nesta execução: $PUBLICOU"
            echo "STORAGE_SITUACAO=iguais ao repositório (publicação: $PUBLICOU)" >> "$GITHUB_ENV"
            if [ "$PUBLICOU" != "success" ]; then
              echo "::warning::a esteira não conseguiu publicar as regras do Storage (permissão do defaultBucket — ver docs/DEPLOY.md), mas as que estão no ar são as do repositório."
            fi
            exit 0
          fi
          echo "STORAGE_SITUACAO=DIVERGENTES do repositório (publicação: $PUBLICOU)" >> "$GITHUB_ENV"
          if [ "$AMBIENTE" = "dev" ]; then
            echo "::error::as regras do Storage no ar ($BUCKET) não são as de storage.rules, e a esteira não conseguiu publicá-las. Publique com 'firebase deploy --only storage --project dev' e veja docs/DEPLOY.md."
            exit 1
          fi
          echo "::warning::as regras do Storage em PRODUÇÃO ($BUCKET) não são as de storage.rules. O dono publica: firebase deploy --only storage --project default"

      # Antes das functions: a revisão do Cloud Run que cada uma serve AGORA.
      # Fumaça vermelha não desfaz function (volta às cegas de código que
      # escreve no banco é pior do que o defeito), mas quem for desfazer na
      # mão precisa saber para onde voltar — o resumo do job mostra.
      - name: Guardar as revisões das functions no ar
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente functions'
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud run services list --project "$PROJETO" --format=json \
            | node scripts/esteira/revisoes-functions.mjs foto > "$RUNNER_TEMP/revisoes-antes.json"

      - name: Cloud Functions
        id: functions
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente functions'
        # --force: os gatilhos do financeiro têm nova tentativa (`retry: true`,
        # #135), e o firebase-tools não publica função com política de falha
        # no modo não interativo sem ele (a esteira do DEV parou nisso em
        # 08/10). Com `--only` e a lista explícita, ele não apaga função que
        # ficou fora da lista — remoção continua sendo à mão.
        run: firebase deploy --only "$ALVOS_FUNCTIONS" --project "$PROJETO" --non-interactive --force

      # Toda function cuja revisão mudou ganha, no resumo, a revisão anterior e
      # o comando que devolve o tráfego para ela. Roda mesmo se o deploy das
      # functions falhou no meio: parte delas pode ter sido trocada.
      - name: Registrar como voltar as functions
        if: always() && steps.functions.outcome != 'skipped' && steps.autenticar.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ANTES="$RUNNER_TEMP/revisoes-antes.json"
          [ -s "$ANTES" ] || { echo "sem a foto de antes do deploy — nada a comparar"; exit 0; }
          gcloud run services list --project "$PROJETO" --format=json > "$RUNNER_TEMP/revisoes-depois.json"
          node scripts/esteira/revisoes-functions.mjs resumo "$ANTES" "$RUNNER_TEMP/revisoes-depois.json" "$PROJETO" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # ── Hosting ─────────────────────────────────────────────────────────
      # Por último: é a chave que liga o que foi publicado para o cliente.
      #
      # Estas sete variáveis são configuração PÚBLICA — vão inteiras no bundle
      # que qualquer visitante baixa. Ficam em `vars`, não em `secrets`, porque
      # chamar de segredo o que é público ensina a equipe a tratar segredo de
      # verdade com a mesma displicência.
      # A versão que está no ar ANTES deste deploy: é para ela que o site volta
      # se a fumaça falhar. O Hosting framework-aware prende cada versão a uma
      # revisão do Cloud Run (pinTags), então voltar o release volta também o
      # servidor da tela.
      - name: Guardar a versão do site que está no ar
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente hosting'
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          ANTERIOR=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/$SITE_ID/releases?pageSize=1" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=(JSON.parse(d).releases||[])[0];process.stdout.write(r&&r.version?r.version.name:'')})")
          echo "versão no ar antes do deploy: ${ANTERIOR:-nenhuma}"
          echo "VERSAO_ANTERIOR=$ANTERIOR" >> "$GITHUB_ENV"

      - name: Hosting (site + renderização no servidor)
        id: hosting
        if: inputs.escopo == 'tudo' || inputs.escopo == 'somente hosting'
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Chave PÚBLICA do reCAPTCHA Enterprise do App Check (28/09).
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          # Só existe no ambiente `dev`: fixa a barbearia de teste em
          # cortehub-dev.web.app, que não tem subdomínio (28/09).
          NEXT_PUBLIC_TENANT_SLUG_FIXO: ${{ vars.NEXT_PUBLIC_TENANT_SLUG_FIXO }}
          # WhatsApp COMERCIAL da plataforma. Nunca chegava ao build de
          # produção: todo "falar com a gente" (upgrade de plano, cadastro
          # pausado) ficava escondido no ar sem ninguém notar (23/09).
          NEXT_PUBLIC_PLATFORM_WHATSAPP: ${{ vars.NEXT_PUBLIC_PLATFORM_WHATSAPP }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::variáveis NEXT_PUBLIC_FIREBASE_* ausentes no ambiente '${{ inputs.ambiente }}'"
            exit 1
          fi
          if [ "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" != "$PROJETO" ]; then
            echo "::error::o app web aponta para '$NEXT_PUBLIC_FIREBASE_PROJECT_ID' e o deploy é de '$PROJETO'."
            exit 1
          fi
          # A instância mínima do SSR NÃO mora no firebase.json: o Hosting
          # framework-aware fixa cada versão por etiqueta (pinTags) e a CLI
          # recusa `minInstances` junto disso. Ela fica no SERVIÇO do Cloud Run
          # (nível de serviço, vale para qualquer revisão) — ver DEPLOY.md.
          #
          # `--force` porque, quando a região do SSR muda, a CLI precisa apagar
          # a função da região anterior e, sem terminal, recusa (24/09: de SP de
          # volta a us-central1). No escopo `--only hosting` a única função que
          # a CLI toca é a do próprio SSR.
          firebase deploy --only hosting --project "$PROJETO" --non-interactive --force

      # ── Fumaça: o site publicado, num navegador de verdade ──────────────
      # O que faltou em 28/09: CI e passeio verdes contra o emulador, e o app
      # no ar travado. Aqui o alvo é o site real: quem já tinha o service
      # worker da versão anterior, a primeira visita, a volta e o login
      # hidratado. Ver `scripts/fumaca/fumaca.mjs` — o MESMO script no DEV e
      # em produção; só muda o quanto ele conta no log.
      #
      # `always()`: roda em TODO escopo e mesmo que um passo de publicação
      # tenha falhado — function ou regra publicada pela metade também pode
      # travar o site, e é justamente aí que se quer saber. Só não roda se a
      # credencial nem chegou a existir (nada foi publicado).
      - name: Teste de fumaça no site publicado
        id: fumaca
        if: always() && steps.autenticar.outcome == 'success'
        working-directory: scripts/fumaca
        env:
          SITE: ${{ env.SITE_FUMACA }}
          PERFIL: ${{ runner.temp }}/fumaca-perfil
          # Só exige o worker da versão nova se a versão nova foi publicada.
          BUILD_ESPERADO: ${{ steps.hosting.outcome == 'success' && github.sha || '' }}
          # Repositório público (08/10): em produção o log mostra só o
          # veredito — nada do console nem dos endereços do site dos clientes.
          DETALHE: ${{ inputs.ambiente == 'dev' && 'completo' || 'resumo' }}
          # Opcionais (docs/MONITORAMENTO.md): a conta de teste de uma barbearia
          # isolada. Segredo inexistente chega vazio, e o passo do painel logado
          # é pulado com aviso — nunca falha por falta de conta.
          FUMACA_EMAIL: ${{ secrets.FUMACA_EMAIL }}
          FUMACA_SENHA: ${{ secrets.FUMACA_SENHA }}
        run: |
          # A identidade do build é a mesma de `next.config.ts`: 12 caracteres.
          export BUILD_ESPERADO="${BUILD_ESPERADO:0:12}"
          node fumaca.mjs

      # Print e diário só do DEV. Em produção a tela é do site de um cliente
      # real, e o artefato de um repositório público é público.
      - name: Guardar a tela da fumaça (só DEV)
        if: failure() && steps.fumaca.outcome == 'failure' && inputs.ambiente == 'dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fumaca-${{ inputs.ambiente }}
          path: scripts/fumaca/saida/
          if-no-files-found: ignore

      # Fumaça vermelha depois de publicar o site: o site volta sozinho para a
      # versão de antes. Functions, regras e índices NÃO voltam — desfazer regra
      # ou código que escreve no banco às cegas é pior. Para as functions, o
      # resumo do job traz a revisão anterior de cada uma e o comando de volta.
      - name: Voltar o site para a versão anterior
        if: failure() && steps.fumaca.outcome == 'failure' && steps.hosting.outcome == 'success' && env.VERSAO_ANTERIOR != ''
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"message":"volta automática: fumaça falhou no deploy ${{ github.run_id }}"}' \
            "https://firebasehosting.googleapis.com/v1beta1/sites/$SITE_ID/releases?versionName=$VERSAO_ANTERIOR" > /dev/null
          echo "::error::fumaça falhou — o site voltou para $VERSAO_ANTERIOR"
          echo "VOLTOU=sim" >> "$GITHUB_ENV"

      # ── Sempre, mesmo se algo acima falhou ──────────────────────────────
      - name: Apagar a credencial do runner
        if: always()
        run: |
          ARQUIVO="$RUNNER_TEMP/conta-de-servico.json"
          # O gcloud guarda cópia da chave ao ativar a conta (passo de autenticar).
          gcloud auth revoke --all --quiet 2>/dev/null || true
          if [ -f "$ARQUIVO" ]; then
            shred -u "$ARQUIVO" 2>/dev/null || rm -f "$ARQUIVO"
            echo "credencial removida do runner"
          fi

      - name: Registrar o que foi publicado
        if: always()
        run: |
          {
            echo "### Deploy em \`$PROJETO\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| escopo | ${{ inputs.escopo }} |"
            echo "| publicado por | @${GITHUB_ACTOR} |"
            echo "| site | $SITE |"
            echo "| regras do Storage | ${STORAGE_SITUACAO:-não conferidas} |"
            echo "| fumaça | ${{ steps.fumaca.outcome || 'não rodou' }} em $SITE_FUMACA |"
            [ "${VOLTOU:-}" = "sim" ] && echo "| ⚠️ | site voltou para \`$VERSAO_ANTERIOR\` |"
            true
          } >> "$GITHUB_STEP_SUMMARY"
