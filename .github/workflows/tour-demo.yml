name: tour de apresentação (gravação)

# Grava o app DE VERDADE — a Barbearia Navalha, fictícia — módulo a módulo,
# no celular (iPhone 13) e no computador (1440×900), contra o emulador. Os
# vídeos são a matéria-prima do tour narrado da apresentação comercial.
# Roda aqui, e não na máquina do dono: emulador, servidor e navegador juntos
# travaram o computador dele (24/09).
#
# Manual de propósito; roda sozinho só quando o próprio tour muda.
on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Nome da barbearia no tour (padrão: Barbearia Navalha, fictícia)"
        required: false
      slug:
        description: "Slug, só letras minúsculas, números e hífen (padrão: navalha)"
        required: false
      cor:
        description: "Cor de destaque em #rrggbb (padrão: #b8863a)"
        required: false
  pull_request:
    paths:
      - scripts/tour-demo/**
      - .github/workflows/tour-demo.yml

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Sao_Paulo
      PROJETO_EMULADOR: demo-tour
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools@15.25.1
      - run: firebase experiments:enable webframeworks

      - name: Functions
        working-directory: functions
        run: npm ci && npm run build

      # O app aponta para o emulador e para um projeto `demo-*`, que o
      # emulador aceita sem credencial nenhuma. As chaves são de mentira.
      - name: Web (build de produção contra o emulador)
        working-directory: web
        env:
          NEXT_PUBLIC_USE_EMULATOR: "true"
          NEXT_PUBLIC_ROOT_DOMAIN: lvh.me
          NEXT_PUBLIC_FIREBASE_API_KEY: demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-tour.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-tour
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-tour.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-DEMO
        run: npm ci && npm run build

      - name: Tour (dependências)
        working-directory: scripts/tour-demo
        run: npm install && npx playwright install --with-deps chromium && (command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg))

      - name: Emulador, servidor, semente e gravação
        env:
          NEXT_PUBLIC_USE_EMULATOR: "true"
          NEXT_PUBLIC_ROOT_DOMAIN: lvh.me
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-tour
          DEMO_NOME: ${{ inputs.nome }}
          DEMO_SLUG: ${{ inputs.slug }}
          DEMO_COR: ${{ inputs.cor }}
        run: |
          firebase emulators:start --only auth,firestore,functions --project demo-tour > emulador.log 2>&1 &
          # A porta 5001 responde antes de as funções carregarem; o sinal certo é o do log.
          until grep -q "All emulators ready" emulador.log; do sleep 2; done
          # Build `output: standalone`: o servidor precisa de `static` e `public` ao lado dele.
          cp -r web/.next/static web/.next/standalone/web/.next/static 2>/dev/null || cp -r web/.next/static web/.next/standalone/.next/static
          cp -r web/public web/.next/standalone/web/public 2>/dev/null || cp -r web/public web/.next/standalone/public
          SERVER=$(ls web/.next/standalone/web/server.js 2>/dev/null || ls web/.next/standalone/server.js)
          PORT=3000 HOSTNAME=0.0.0.0 node "$SERVER" > web.log 2>&1 &
          until curl -s -o /dev/null http://127.0.0.1:3000; do sleep 2; done
          node scripts/tour-demo/semear-demo.mjs
          node scripts/tour-demo/gravar-tour.mjs
          {
            echo "### Tour gravado"
            node -e 'const r=require("./scripts/tour-demo/saida/roteiro.json");console.log("| aparelho | módulo | pronta (s) | duração (s) | falha |\n|---|---|---|---|---|");for(const v of r.videos)console.log(`| ${v.aparelho} | ${v.modulo} | ${v.inicio} | ${v.duracao} | ${v.falha??""} |`)'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-demo
          path: |
            scripts/tour-demo/saida/*.mp4
            scripts/tour-demo/saida/*.png
            scripts/tour-demo/saida/*.json
            emulador.log
            web.log
          retention-days: 14
