name: passeio no celular

# Passa por todas as telas em iPhone SE, iPhone 13, Android e PC 1366, contra
# o emulador com uma barbearia semeada, e guarda fotos + medições como
# artefato. Roda aqui, e não na máquina do dono: emulador, servidor e
# navegador juntos travaram o computador dele (24/09).
#
# Manual de propósito — é uma revisão de tela, não um portão do merge. Roda
# sozinho só quando o próprio passeio muda, para provar que ele funciona.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/passeio-celular/**
      - .github/workflows/passeio-celular.yml

permissions:
  contents: read

jobs:
  passeio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Sao_Paulo
      PROJETO_EMULADOR: demo-passeio
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools@15.25.1
      - run: firebase experiments:enable webframeworks

      - name: Functions
        working-directory: functions
        run: npm ci && npm run build

      # O app aponta para o emulador e para um projeto `demo-*`, que o
      # emulador aceita sem credencial nenhuma. As chaves são de mentira.
      - name: Web (build de produção contra o emulador)
        working-directory: web
        env:
          NEXT_PUBLIC_USE_EMULATOR: "true"
          NEXT_PUBLIC_ROOT_DOMAIN: lvh.me
          NEXT_PUBLIC_FIREBASE_API_KEY: demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-passeio.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-passeio
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-passeio.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-DEMO
        run: npm ci && npm run build

      - name: Passeio (dependências)
        working-directory: scripts/passeio-celular
        run: npm install && npx playwright install --with-deps chromium

      - name: Emulador, servidor, semente e passeio
        env:
          NEXT_PUBLIC_USE_EMULATOR: "true"
          NEXT_PUBLIC_ROOT_DOMAIN: lvh.me
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-passeio
        run: |
          firebase emulators:start --only auth,firestore,functions --project demo-passeio > emulador.log 2>&1 &
          until curl -s -o /dev/null http://127.0.0.1:8080 && curl -s -o /dev/null http://127.0.0.1:9099 && curl -s -o /dev/null http://127.0.0.1:5001; do sleep 2; done
          (cd web && npx next start -p 3000 > ../web.log 2>&1 &)
          until curl -s -o /dev/null http://127.0.0.1:3000; do sleep 2; done
          # firebase-admin do próprio passeio, para não depender de node_modules de outro pacote.
          cp scripts/semear-day-in-the-life.mjs scripts/passeio-celular/
          node scripts/passeio-celular/semear-day-in-the-life.mjs
          node scripts/passeio-celular/semear-agenda.mjs
          node scripts/passeio-celular/passeio.mjs
          cat scripts/passeio-celular/saida/relatorio.md >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passeio-celular
          path: |
            scripts/passeio-celular/saida/
            emulador.log
            web.log
          retention-days: 14
