<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JPBarber">
  <!--
    JPBarber — símbolo: a LINHA QUE CRUZA O ZERO.

    O dia em que a barbearia sai do vermelho. Barbearia tem dois clichês
    visuais — poste listrado e tesoura — e os dois já estão em todo concorrente.

    Duas versões antes desta:
    v1 juntava monograma e símbolo, com "JP" vazado num bloco escuro sobre fundo
    escuro: dentro das letras aparecia a mesma cor de fora, e não se via nada.
    v2 acertou a legibilidade mas a barra do zero era escura demais — a linha
    subia sozinha e o cruzamento, que é a ideia inteira, não se lia.

    Aqui a barra é dourada e ATRAVESSA a diagonal em toda a largura, e a linha
    passa por cima com um contorno escuro que separa as duas. É o contorno que
    faz o cruzamento existir: sem ele, dourado sobre dourado vira mancha.
  -->
  <rect width="512" height="512" rx="116" fill="#17140f"/>

  <!-- O zero. Atravessa de ponta a ponta: é uma referência, não um detalhe. -->
  <line x1="88" y1="304" x2="424" y2="304"
        stroke="#b8863a" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

  <!-- Contorno escuro sob a diagonal: cria o vão que faz o cruzamento aparecer. -->
  <path d="M 122,392 L 220,336 L 302,258 L 392,150"
        fill="none" stroke="#17140f" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A subida. -->
  <path d="M 122,392 L 220,336 L 302,258 L 392,150"
        fill="none" stroke="#d9a44f" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chegou. -->
  <circle cx="392" cy="150" r="31" fill="#f8f5ee"/>
</svg>
