<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JPBarber">
  <!--
    JPBarber — símbolo.

    Monograma monoline com o fio dourado embaixo. Duas tentativas anteriores
    falharam e o motivo vale ficar registrado:

    v1 vazava o "JP" num bloco escuro sobre fundo escuro — dentro das letras
    aparecia a mesma cor de fora, e não se via nada.
    v2 trocou o monograma por uma linha em ascensão. Ficou legível, mas linha
    subindo é o símbolo mais genérico que existe em software: diz "dashboard",
    não "barbearia". Genérico é pior que feio, porque não se reconhece.

    As letras são TRAÇOS DESENHADOS, não texto com fonte. É o que garante que o
    desenho seja idêntico no navegador, num e-mail e num editor vetorial — o
    problema que derrubou a assinatura horizontal na primeira versão.

    O fio dourado é o que sobrou da ideia da marca: a linha do zero, o dia em
    que a barbearia sai do vermelho. Como detalhe, não como protagonista.
  -->
  <rect width="512" height="512" rx="116" fill="#17140f"/>
  <g fill="none" stroke="#f8f5ee" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 214,150 L 214,286 A 52,52 0 0 1 110,286"/>
    <path d="M 296,362 L 296,150 L 344,150 A 56,56 0 0 1 344,262 L 296,262"/>
  </g>
  <line x1="110" y1="392" x2="402" y2="392"
        stroke="#d9a44f" stroke-width="20" stroke-linecap="round"/>
</svg>
